<style>
:root{
    --navy:#0F2771; --blue:#004D9F; --cyan:#0C96C5; --purple:#32146D;
    --magenta:#853283; --coral:#D54B51; --ink:#1A1F2E; --paper:#F4F7FB;
    --line:#E1E7F2; --muted:#8892A6; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.brand-font{font-family:'Cairo', sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .app{display:flex; min-height:100vh; align-items:stretch;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:264px; flex-shrink:0; background:linear-gradient(180deg, var(--navy), #0B1E56);
    color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    padding:28px 20px; overflow-y:auto;
  }
  .sidebar-logo{display:flex; justify-content:center; margin-bottom:8px;}
  .sidebar-logo img{width:172px; height:auto;}
  .sidebar-sub{
    text-align:center; font-size:11px; color:#93A6DD; margin-bottom:30px;
    letter-spacing:.2px;
  }
  .nav-list{display:flex; flex-direction:column; gap:6px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
    background:transparent; border:none; color:#C6D0F0; font-weight:700; font-size:14px;
    text-align:right; width:100%; border-inline-end:3px solid transparent; transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.12); color:#fff; border-inline-end:3px solid var(--cyan);}
  .nav-item svg{width:18px; height:18px; flex-shrink:0;}
  .sidebar-footer{
    font-size:11px; color:#7B8FCB; text-align:center; padding-top:18px;
    border-top:1px solid rgba(255,255,255,.12); margin-top:16px;
    display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .logout-btn{
    width:100%; background:rgba(255,255,255,.08); border:none; color:#C6D0F0;
    font-size:12px; font-weight:700; padding:9px 14px; border-radius:999px;
  }
  .logout-btn:hover{background:rgba(255,255,255,.16); color:#fff;}
  .storage-btn{
    width:100%; background:rgba(255,255,255,.08); border:none; color:#C6D0F0;
    font-size:12px; font-weight:700; padding:9px 14px; border-radius:999px;
  }
  .storage-btn:hover{background:rgba(255,255,255,.16); color:#fff;}
  .sync-badge{
    width:100%; font-size:10.5px; font-weight:700; padding:6px 10px; border-radius:999px;
    background:rgba(255,255,255,.06); color:#9AB0E8;
  }
  .sync-badge.sync-error{background:rgba(213,75,81,.18); color:#F5B7B9;}
  .sync-badge.sync-connecting{background:rgba(255,255,255,.06); color:#C6D0F0;}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--navy), var(--purple)); padding:24px;
  }
  .login-card{
    background:#fff; border-radius:20px; padding:40px 36px; width:100%; max-width:380px;
    box-shadow:0 24px 60px rgba(11,30,86,.35);
  }
  .login-logo{display:block; width:100%; max-width:220px; margin:0 auto 14px;}
  .login-sub{text-align:center; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:28px;}
  .login-form .field{margin-bottom:16px;}
  .login-form .field input{width:100%;}
  .login-error{
    background:#FBEAEA; color:var(--coral); font-size:12.5px; font-weight:700;
    border-radius:10px; padding:9px 12px; margin-bottom:14px; text-align:center;
  }
  .btn.full{width:100%; justify-content:center; padding:12px 18px; font-size:14px; margin-top:6px;}

  /* ---------- Main content ---------- */
  .content{flex:1; min-width:0; padding:32px 40px 64px;}
  .content-inner{max-width:1180px; margin:0 auto;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:16px; flex-wrap:wrap;}
  .topbar .eyebrow{font-size:12px; font-weight:700; color:var(--cyan); margin-bottom:2px;}
  .topbar h1{font-size:24px; margin:0; color:var(--navy);}
  .date-pill{
    background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 16px;
    font-size:13px; font-weight:600; color:var(--muted);
  }

  .btn{
    display:inline-flex; align-items:center; gap:8px; border:none; border-radius:10px;
    padding:10px 18px; font-weight:700; font-size:13.5px; color:#fff; background:var(--navy);
  }
  .btn.accent{background:var(--cyan);}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .btn.small{padding:6px 12px; font-size:12px;}
  .btn.small svg{width:13px; height:13px;}
  .btn svg{width:15px; height:15px;}

  .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px;}
  .empty-state{
    text-align:center; padding:40px 20px; border:2px dashed var(--line); border-radius:16px; color:#9AA3B8;
  }
  .empty-state img{width:34px; height:34px; margin-bottom:10px; opacity:.85;}

  .section-title{display:flex; align-items:center; gap:12px; margin:0 0 16px;}
  .section-title .ico{
    width:40px; height:40px; border-radius:12px; background:var(--navy); display:flex;
    align-items:center; justify-content:center; flex-shrink:0;
  }
  .section-title .ico svg{width:18px; height:18px; color:#fff;}
  .section-title .eyebrow{font-size:11px; font-weight:700; color:var(--cyan); margin-bottom:1px;}
  .section-title h2{font-size:17px; margin:0; color:var(--navy);}

  .divider{display:flex; align-items:center; gap:12px; margin:22px 0;}
  .divider .line{flex:1; height:1px;}
  .divider .line.l{background:linear-gradient(90deg, transparent, var(--purple));}
  .divider .line.r{background:linear-gradient(90deg, var(--cyan), transparent);}
  .divider img{width:22px; height:22px;}

  /* ---------- Dashboard ---------- */
  .hero{
    border-radius:20px; padding:28px 32px; position:relative; overflow:hidden; margin-bottom:26px;
    background:linear-gradient(120deg, var(--navy), var(--purple));
    color:#fff;
  }
  .hero img.hero-mark{position:absolute; left:-18px; bottom:-30px; width:190px; opacity:.16;}
  .hero .rel{position:relative;}
  .hero .when{font-size:13.5px; color:#B9C6E8;}
  .hero h2{font-size:22px; margin:6px 0 6px; color:#fff;}
  .hero .sub{font-size:13.5px; color:#C7D2EE; max-width:560px;}

  .stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:18px; margin-bottom:28px;}
  .stat-card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px;}
  .stat-card .num{font-size:26px; font-weight:800; font-family:'Cairo'; color:var(--navy);}
  .stat-card .lbl{font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px;}

  .dash-grid{display:grid; grid-template-columns:1.7fr 1fr; gap:24px; align-items:start;}

  .list{display:flex; flex-direction:column; gap:10px;}
  .item{
    display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line);
    border-radius:13px; padding:12px 14px;
  }
  .item .time{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:56px; flex-shrink:0; color:var(--cyan); font-size:11px; font-weight:700; gap:2px;
  }
  .item .title{font-weight:700; font-size:13.5px; color:var(--ink);}
  .item .meta{font-size:11.5px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:4px;}
  .item .flex1{flex:1; min-width:0;}
  .chip{font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:999px; flex-shrink:0;}
  .check{
    width:24px; height:24px; border-radius:999px; border:2px solid var(--navy); flex-shrink:0;
    background:transparent; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .check svg{width:13px; height:13px; color:var(--navy); display:none;}
  .check.done svg{display:block;}
  .trash-btn{background:none; border:none; padding:4px; flex-shrink:0;}
  .trash-btn svg{width:15px; height:15px; color:#C3CCDE;}
  .icon-btn{background:none; border:none; padding:4px; flex-shrink:0;}
  .icon-btn svg{width:14px; height:14px; color:#C3CCDE;}
  .icon-btn:hover svg{color:var(--blue);}
  .event-actions{display:flex; gap:2px; align-items:center;}

  .side-panel{display:flex; flex-direction:column; gap:22px;}
  .alert-row{
    display:flex; align-items:center; gap:10px; border-radius:12px; padding:10px 12px; font-size:12.5px;
  }
  .alert-row.late{background:#FBEAEA; color:var(--coral);}
  .alert-row.soon{background:#EAF6FB; color:var(--cyan);}
  .alert-row svg{width:15px; height:15px; flex-shrink:0;}
  .alert-row .t{flex:1; color:var(--ink); font-weight:700;}

  /* ---------- Weekly timetable ---------- */
  .week-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:16px;}
  .day-col-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
    font-weight:800; font-family:'Cairo'; color:var(--navy); font-size:14px;
  }
  .day-col-head .count{
    font-size:11px; background:var(--paper); color:var(--muted); border-radius:999px; padding:2px 9px; font-weight:700;
  }
  .day-col{background:transparent;}
  .day-empty{font-size:11.5px; color:#B7C0D6; padding:10px 2px;}
  .event-card{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px;
  }
  .event-card .t{font-size:11.5px; font-weight:800; color:var(--cyan); margin-bottom:3px;}
  .event-card .n{font-size:13px; font-weight:700; color:var(--ink);}
  .event-card .loc{font-size:11px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:3px;}
  .event-card .row{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;}
  .inline-edit{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .inline-edit .full{grid-column:1 / -1;}
  .inline-edit .field label{font-size:10.5px; font-weight:700; color:var(--navy); display:block; margin-bottom:4px;}
  .inline-edit .field input, .inline-edit .field select{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-family:'Cairo'; font-size:12px; background:#fff;
  }
  .inline-edit .actions{grid-column:1 / -1; display:flex; justify-content:flex-end; gap:8px; margin-top:2px;}
  .inline-edit .actions .btn{padding:6px 14px; font-size:12px;}

  /* ---------- Forms / panels ---------- */
  .panel{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:22px;
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
  }
  .panel .full{grid-column:1 / -1;}
  .field label{font-size:12px; font-weight:700; color:var(--navy); display:block; margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px; color:var(--ink);
  }
  .panel .actions{grid-column:1 / -1; display:flex; justify-content:flex-end; gap:10px; margin-top:4px;}

  /* ---------- Tasks table ---------- */
  .filter-row{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .filter-pill{
    border:1px solid var(--line); background:transparent; border-radius:999px; padding:7px 16px;
    font-size:12.5px; font-weight:700; color:var(--muted);
  }
  .filter-pill.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  table.tasks-table{width:100%; border-collapse:separate; border-spacing:0 10px;}
  table.tasks-table tr{background:#fff;}
  table.tasks-table td{padding:12px 14px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:13.5px;}
  table.tasks-table td:first-child{border-inline-start:1px solid var(--line); border-radius:12px 0 0 12px;}
  table.tasks-table td:last-child{border-inline-end:1px solid var(--line); border-radius:0 12px 12px 0;}
  table.tasks-table .tt{font-weight:700; color:var(--ink);}
  table.tasks-table .meta{font-size:11px; color:var(--muted); margin-top:3px;}
  .evidence-btn{border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer;}
  .evidence-btn.has{color:var(--blue); border-color:var(--blue); background:#EAF1FC;}
  .evidence-row td{border-radius:0 !important; border:none !important; padding:0 14px 16px !important;}
  .evidence-panel{background:#F7F8FA; border:1px dashed var(--line); border-radius:12px; padding:14px;}
  .upload-btn{display:inline-block; background:var(--navy); color:#fff; font-family:'Cairo'; font-weight:700; font-size:12.5px; padding:9px 16px; border-radius:9px; cursor:pointer;}
  .upload-btn input{display:none;}
  .evidence-grid{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;}
  .evidence-thumb{position:relative; width:110px; height:110px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#fff;}
  .evidence-thumb img, .evidence-thumb video{width:100%; height:100%; object-fit:cover;}
  .evidence-remove{position:absolute; top:4px; left:4px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:6px; width:20px; height:20px; display:flex; align-items:center; justify-content:center;}
  .evidence-remove svg{width:12px; height:12px;}
  .report-evidence-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .report-evidence-grid img, .report-evidence-grid video{width:90px; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
  .done-row td{opacity:.5;}

  /* ---------- إدارة مساحة التخزين ---------- */
  .storage-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .storage-panel{
    background:#fff; border-radius:16px; padding:22px 24px; width:100%; max-width:640px;
    max-height:86vh; overflow-y:auto; box-shadow:0 20px 60px rgba(15,23,42,.3);
  }
  .storage-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .storage-list{display:flex; flex-direction:column; gap:8px;}
  .storage-item{display:flex; align-items:center; gap:12px; background:#F7F8FA; border:1px solid var(--line); border-radius:10px; padding:8px 12px;}
  .storage-thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0; background:#EEF1F6;}
  .storage-thumb.storage-video{display:flex; align-items:center; justify-content:center; font-size:18px;}
  .done-row .tt{text-decoration:line-through;}

  /* ---------- Vision page ---------- */
  .vision-wrap{max-width:760px;}
  .vision-field{margin-bottom:22px;}
  .vision-field label{font-weight:800; color:var(--navy); font-size:14.5px; display:block; margin-bottom:4px;}
  .vision-field .helper{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .vision-field textarea{
    width:100%; border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:13.5px;
    color:var(--ink); resize:vertical; min-height:84px;
  }

  /* ---------- Calendar ---------- */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .cal-title{font-family:'Cairo'; font-weight:800; font-size:18px; color:var(--navy);}
  .cal-nav{display:flex; gap:8px; align-items:center;}
  .cal-nav button{border:1px solid var(--line); background:#fff; border-radius:10px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;}
  .cal-nav button svg{width:15px; height:15px; color:var(--navy);}
  .cal-today-btn{border:1px solid var(--line) !important; background:#fff; border-radius:10px !important; padding:0 14px !important; width:auto !important; font-size:12.5px; font-weight:700; color:var(--navy);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
  .cal-daylabel{text-align:center; font-size:11px; font-weight:800; color:var(--muted); padding-bottom:4px;}
  .cal-cell{
    min-height:118px; border:1px solid var(--line); border-radius:12px; background:#fff; padding:8px;
    cursor:pointer; display:flex; flex-direction:column; gap:5px; overflow:hidden;
  }
  .cal-cell.blank{background:transparent; border-color:transparent; cursor:default;}
  .cal-cell.today{border-color:var(--cyan); border-width:2px;}
  .cal-cell.selected{background:#EAF1FC; border-color:var(--blue);}
  .cal-cell.in-plan{background:#FBF3FA;}
  .cal-cell.selected.in-plan{background:#EAF1FC;}
  .cal-date{font-weight:800; font-size:12.5px; color:var(--ink);}
  .cal-labels{display:flex; flex-direction:column; gap:3px; overflow:hidden;}
  .cal-label{font-size:10.5px; font-weight:700; line-height:1.35; padding:3px 6px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cal-more{font-size:10px; font-weight:700; color:var(--muted); padding:1px 6px;}
  .cal-details{margin-top:26px;}
  .cal-details .head{font-family:'Cairo'; font-weight:800; font-size:15px; color:var(--navy); margin-bottom:14px;}
  .sy-badge{display:inline-block; background:#EAF1FC; color:var(--navy); border-radius:20px;
    padding:3px 11px; font-size:11px; font-weight:800; margin-inline-start:8px; vertical-align:middle;}
  .cal-view-toggle{display:flex; gap:6px; background:#F0F2F6; border-radius:10px; padding:4px;}
  .cal-view-toggle button{border:none; background:transparent; border-radius:8px; padding:8px 16px; font-family:'Cairo'; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer;}
  .cal-view-toggle button.active{background:#fff; color:var(--navy); box-shadow:0 1px 4px rgba(0,0,0,.08);}
  table.cal-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.cal-table th{background:var(--navy); color:#fff; padding:10px 12px; font-family:'Cairo'; font-weight:700; font-size:12.5px; text-align:start;}
  table.cal-table th:first-child{border-radius:10px 0 0 0;}
  table.cal-table th:last-child{border-radius:0 10px 0 0;}
  table.cal-table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.cal-table tr.cal-row-today td{background:#EAF1FC;}
  table.cal-table tr.cal-row-plan td{background:#FBF9FC;}
  table.cal-table .cal-table-day{font-weight:800; color:var(--navy); white-space:nowrap;}
  table.cal-table .cal-table-date{color:var(--muted); font-size:12px; white-space:nowrap;}
  table.cal-table .cal-table-items div{margin-bottom:4px;}
  table.cal-table .cal-table-items div:last-child{margin-bottom:0;}
  .report-card{background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden;}
  .report-card h3{font-family:'Cairo'; font-size:16px; font-weight:800; color:var(--navy); margin:22px 0 10px;}
  .report-card ul{margin:0; padding-inline-start:20px;}
  .report-card li{font-size:13.5px; color:var(--ink); margin-bottom:6px; line-height:1.6;}
  .report-toolbar{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center;}
  .report-mode-toggle{display:flex; gap:6px; background:#F0F2F6; border-radius:10px; padding:4px;}
  .report-mode-toggle button{border:none; background:transparent; border-radius:8px; padding:8px 16px; font-family:'Cairo'; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer;}
  .report-mode-toggle button.active{background:#fff; color:var(--navy); box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .report-toolbar select{border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-family:'Cairo'; font-size:13px; background:#fff;}

  /* ================= تقرير النشاط — بأسلوب التقرير السنوي الرسمي ================= */
  .rpt-doc{background:#E7EAF0; padding:22px; border-radius:16px;}
  .rpt-page{
    width:100%; max-width:820px; margin:0 auto 22px; background:#fff; position:relative;
    box-shadow:0 6px 26px rgba(15,39,113,.10); border-radius:6px; overflow:hidden;
    padding:52px 56px 64px; min-height:1000px;
  }
  .rpt-page.dark{background:linear-gradient(160deg,#12306F 0%,#0F2771 55%,#14357C 100%); color:#fff;}

  /* غلاف */
  .rpt-cover-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:120px;}
  .rpt-cover-head img{height:74px;}
  .rpt-cover-org{text-align:end; font-family:'Cairo';}
  .rpt-cover-org .a{font-weight:800; font-size:15px; color:#fff;}
  .rpt-cover-org .b{font-size:12.5px; opacity:.62; margin-top:4px;}
  .rpt-eyebrow-w{display:flex; align-items:center; gap:10px; justify-content:flex-end; font-size:13px; font-weight:700; color:#8FD4EA; margin-bottom:16px;}
  .rpt-eyebrow-w::after{content:""; width:26px; height:2px; background:#8FD4EA;}
  .rpt-cover-title{font-family:'Cairo'; font-weight:800; font-size:56px; line-height:1.12; text-align:end; margin-bottom:14px;}
  .rpt-cover-sub{font-family:'Cairo'; font-weight:800; font-size:24px; color:#7FD3EC; text-align:end; margin-bottom:6px;}
  .rpt-cover-sub small{display:block; font-size:17px; font-weight:600; opacity:.8; margin-top:6px;}
  .rpt-chips{display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; margin-top:34px;}
  .rpt-chip{background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22); border-radius:26px; padding:10px 20px; font-size:13px; font-weight:700;}
  .rpt-signbox{margin-top:96px; margin-inline-start:auto; width:max-content; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:16px 22px; display:flex; align-items:center; gap:16px;}
  .rpt-signbox .bar{width:3px; align-self:stretch; background:#7FD3EC; border-radius:3px;}
  .rpt-signbox .r{font-size:12px; opacity:.7; margin-bottom:4px;}
  .rpt-signbox .n{font-family:'Cairo'; font-weight:800; font-size:19px; color:#7FD3EC;}

  /* رأس الصفحات الداخلية */
  .rpt-watermark{position:absolute; top:26px; inset-inline-start:44px; font-family:'Cairo'; font-weight:800;
    font-size:104px; line-height:1; color:#EDF0F6; user-select:none;}
  .rpt-eyebrow{display:flex; align-items:center; gap:10px; justify-content:flex-end; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:10px;}
  .rpt-eyebrow::after{content:""; width:22px; height:2px; background:var(--cyan);}
  .rpt-h1{font-family:'Cairo'; font-weight:800; font-size:34px; color:var(--navy); text-align:end; margin-bottom:8px; position:relative; z-index:1;}
  .rpt-lead{font-size:13.5px; color:var(--muted); text-align:end; margin-bottom:30px;}
  .rpt-body p{font-size:14px; line-height:2.05; color:#33405C; text-align:justify; margin:0 0 16px;}
  .rpt-body b{color:var(--navy);}

  /* بطاقات إحصاء */
  .rpt-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:30px 0 6px;}
  .rpt-stat{background:#F4F6FA; border-radius:12px; padding:22px 10px; text-align:center;}
  .rpt-stat .n{font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:34px; color:var(--navy); line-height:1;}
  .rpt-stat .l{font-size:11.5px; color:var(--muted); margin-top:8px;}

  /* بطاقات إحصاء ملوّنة */
  .rpt-bigstats{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px;}
  .rpt-bigstat{border-radius:14px; padding:22px 20px; color:#fff; position:relative; min-height:104px;}
  .rpt-bigstat .n{font-family:Georgia,serif; font-weight:700; font-size:38px; line-height:1;}
  .rpt-bigstat .l{font-size:12.5px; opacity:.92; margin-top:8px;}
  .rpt-bigstat .badge{position:absolute; top:16px; inset-inline-start:18px; background:rgba(255,255,255,.18);
    border-radius:8px; padding:4px 11px; font-size:12px; font-weight:700;}
  .rpt-bigstat.soft{background:#F4F6FA; color:var(--navy);}
  .rpt-bigstat.soft .l{color:var(--muted);}
  .rpt-bigstat.soft .badge{background:#E4E9F2; color:var(--muted);}

  /* شريط مجال */
  .rpt-domain{border-radius:14px; padding:20px 24px; color:#fff; display:flex; align-items:center;
    justify-content:space-between; margin:26px 0 16px;}
  .rpt-domain .n{font-family:Georgia,serif; font-weight:700; font-size:32px; line-height:1;}
  .rpt-domain .l{font-size:12.5px; opacity:.9; margin-top:6px;}
  .rpt-domain .pill{background:rgba(255,255,255,.18); border-radius:22px; padding:8px 18px; font-size:12.5px; font-weight:700;}

  /* بطاقات البرامج */
  .rpt-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .rpt-cards.two{grid-template-columns:repeat(2,1fr);}
  .rpt-cards.one{grid-template-columns:1fr;}
  .rpt-cardx{background:#F7F9FC; border:1px solid #EAEEF5; border-radius:12px; padding:15px 17px;
    border-inline-end:3px solid var(--navy);}
  .rpt-cardx .t{font-family:'Cairo'; font-weight:800; font-size:13.5px; color:var(--navy); margin-bottom:6px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .rpt-cardx .d{font-size:11.5px; color:#5B6780; line-height:1.75;}
  .rpt-datepill{background:var(--navy); color:#fff; border-radius:20px; padding:3px 11px; font-size:10.5px; font-weight:700;}
  .rpt-cardx.hi{background:var(--navy); border-color:var(--navy);}
  .rpt-cardx.hi .t{color:#fff;} .rpt-cardx.hi .d{color:rgba(255,255,255,.82);}

  /* معرض */
  .rpt-gal{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px;}
  .rpt-gal.wide{grid-template-columns:1fr;}
  .rpt-gal figure{margin:0; position:relative; border-radius:12px; overflow:hidden; background:#0F2771;}
  .rpt-gal img, .rpt-gal video{width:100%; height:150px; object-fit:cover; display:block;}
  .rpt-gal.wide img, .rpt-gal.wide video{height:250px;}
  .rpt-video-placeholder{width:100%; height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; font-size:32px; background:linear-gradient(160deg,#12306F,#0F2771); color:#fff;}
  .rpt-video-placeholder span{font-family:'Cairo'; font-weight:700; font-size:12px; opacity:.85;}
  .rpt-gal.wide .rpt-video-placeholder{height:250px;}
  .rpt-gal figcaption{position:absolute; inset-inline:0; bottom:0; padding:26px 14px 12px; color:#fff;
    font-family:'Cairo'; font-weight:800; font-size:13px; text-align:end;
    background:linear-gradient(to top, rgba(10,25,64,.88), rgba(10,25,64,0));}

  /* شبكة الأثر */
  .rpt-impact{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .rpt-impactx{background:#fff; border:1px solid #E6EAF2; border-radius:12px; padding:18px 20px; border-top:3px solid var(--navy);}
  .rpt-impactx .t{font-family:'Cairo'; font-weight:800; font-size:14px; color:var(--navy); margin-bottom:7px; text-align:end;}
  .rpt-impactx .d{font-size:12px; color:#5B6780; line-height:1.85; text-align:end;}
  .rpt-quote{background:linear-gradient(120deg,#12306F,#0F2771); color:#fff; border-radius:12px;
    padding:20px 24px; font-size:13.5px; line-height:1.9; margin-top:18px; text-align:end;}

  /* تذييل الصفحة */
  .rpt-foot{position:absolute; inset-inline:56px; bottom:26px; display:flex; justify-content:space-between;
    align-items:center; border-top:1px solid #E6EAF2; padding-top:12px; font-size:11px; color:#9AA4B8;}
  .rpt-empty2{color:var(--muted); font-size:13px; background:#F4F6FA; border-radius:10px; padding:16px 18px; text-align:end;}

  /* خاتمة */
  .rpt-page.dark .rpt-eyebrow{color:#8FD4EA;} .rpt-page.dark .rpt-eyebrow::after{background:#8FD4EA;}
  .rpt-end-title{font-family:'Cairo'; font-weight:800; font-size:52px; line-height:1.15; text-align:end; margin-bottom:34px;}
  .rpt-end-body p{font-size:14px; line-height:2.1; opacity:.9; text-align:justify; margin:0 0 18px;}
  .rpt-end-sign{position:absolute; inset-inline:56px; bottom:56px; display:flex; justify-content:space-between; align-items:flex-end;}
  .rpt-end-sign .who{display:flex; align-items:center; gap:14px;}
  .rpt-end-sign .bar{width:3px; height:42px; background:#7FD3EC; border-radius:3px;}
  .rpt-end-sign .n{font-family:'Cairo'; font-weight:800; font-size:17px;}
  .rpt-end-sign .r{font-size:12px; opacity:.7; margin-top:3px;}
  .rpt-end-sign img{height:42px; opacity:.9;}

  /* مستند طباعة الخطة — يبقى مخفيًا في الشاشة العادية ولا يظهر إلا عند الطباعة */
  .plan-print-only{display:none;}

  @media print {
    /* التصميم (غلاف + صفحات موضوعية بعناوين كبيرة ومساحات رأسية) مبني عمدًا لصفحة طولية —
       نقفله على portrait عمدًا لأن وضع landscape يكسر التقسيم بين الصفحات (المحتوى يفيض لصفحة إضافية
       فارغة تقريبًا بسبب انخفاض الارتفاع المتاح) بدل ما يعيد ترتيب نفسه تلقائيًا. */
    @page { size:A4 portrait; margin:0; }
    body{background:#fff;}
    .sidebar, .topbar, .report-toolbar, .nav-item, .storage-overlay { display:none !important; }
    .app, .main { display:block !important; padding:0 !important; margin:0 !important; }
    .plan-screen-only{display:none !important;}
    .plan-print-only{display:block !important;}
    .rpt-doc{background:#fff !important; padding:0 !important; border-radius:0 !important;}
    .rpt-page{
      max-width:none !important; width:210mm !important; min-height:297mm !important;
      margin:0 !important; box-shadow:none !important; border-radius:0 !important;
      padding:16mm 15mm 20mm !important; page-break-after:always; break-after:page;
    }
    .rpt-page:last-child{page-break-after:auto; break-after:auto;}
    .rpt-page.dark{background:#0F2771 !important;}
    .rpt-foot{inset-inline:15mm !important; bottom:9mm !important;}
    .rpt-end-sign{inset-inline:15mm !important; bottom:18mm !important;}
    *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}
  }


  /* ===== الإطار الوزاري ===== */
  .moe-box{background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px 28px;}
  .moe-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    border-bottom:2px solid var(--cyan); padding-bottom:16px; margin-bottom:20px; flex-wrap:wrap;}
  .moe-head .eyebrow{font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .moe-head .ttl{font-family:'Cairo'; font-weight:800; font-size:19px; color:var(--navy);}
  .moe-ref{background:#EAF1FC; color:var(--navy); border-radius:20px; padding:7px 14px; font-size:11.5px; font-weight:700;}
  .moe-sub{font-family:'Cairo'; font-weight:800; font-size:13.5px; color:var(--navy); margin:22px 0 12px;
    display:flex; align-items:center; gap:8px;}
  .moe-sub::before{content:""; width:4px; height:15px; background:var(--cyan); border-radius:3px;}
  .moe-tracks{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;}
  .moe-track{background:#F7F9FC; border:1px solid var(--line); border-inline-start:4px solid var(--navy);
    border-radius:10px; padding:14px 16px;}
  .moe-track b{display:block; font-family:'Cairo'; font-size:13.5px; color:var(--navy); margin-bottom:6px;}
  .moe-track span{font-size:12px; color:#5B6780; line-height:1.8;}
  .moe-cov{display:flex; flex-direction:column; gap:9px;}
  .moe-cov-row{display:flex; align-items:center; gap:12px;}
  .moe-cov-row .nm{width:150px; font-size:12.5px; font-weight:700; flex-shrink:0;}
  .moe-cov-row .br{flex:1; height:9px; background:#EEF1F6; border-radius:6px; overflow:hidden;}
  .moe-cov-row .br i{display:block; height:100%; border-radius:6px; min-width:3px;}
  .moe-cov-row .vl{width:26px; text-align:center; font-size:12.5px; font-weight:800; flex-shrink:0;}
  .moe-targets{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:9px;}
  .moe-target{display:flex; align-items:center; gap:10px; background:#F7F9FC; border:1px solid var(--line);
    border-radius:9px; padding:10px 13px;}
  .moe-target b{font-family:Georgia,serif; font-size:15px; color:var(--cyan); flex-shrink:0;}
  .moe-target span{font-size:11.5px; color:#41506B; line-height:1.6;}
  .moe-tools{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px;}
  .moe-tool{background:#fff; border:1px solid var(--line); border-top:3px solid var(--purple);
    border-radius:10px; padding:13px 15px;}
  .moe-tool b{display:block; font-family:'Cairo'; font-size:12.5px; color:var(--navy); margin-bottom:5px;}
  .moe-tool span{font-size:11.5px; color:#5B6780; line-height:1.7;}
  .moe-progs{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px;}
  .moe-prog-col{border:1px solid var(--line); border-radius:11px; overflow:hidden; background:#fff; display:flex; flex-direction:column;}
  .moe-prog-col .hd{color:#fff; font-family:'Cairo'; font-weight:800; font-size:12px; padding:9px 12px;
    display:flex; justify-content:space-between; align-items:center;}
  .moe-prog-col .hd span{background:rgba(255,255,255,.22); border-radius:11px; padding:1px 8px; font-size:11px;}
  .moe-prog-col .bd{padding:7px 9px; max-height:190px; overflow-y:auto; flex:1;}
  .moe-prog-col .pr{display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-size:11.5px; color:#41506B; padding:5px 6px; border-radius:6px; line-height:1.5;}
  .moe-prog-col .pr:hover{background:#F4F6FA;}
  .moe-prog-col .pr.empty{color:var(--muted); font-style:italic;}
  .moe-prog-col .pr .trash-btn svg{width:12px; height:12px;}
  .moe-prog-col .ft{display:flex; gap:5px; padding:8px 9px; border-top:1px solid var(--line); background:#FAFBFD;}
  .moe-prog-col .ft input{flex:1; min-width:0; border:1px solid var(--line); border-radius:7px;
    padding:6px 8px; font-family:'Cairo'; font-size:11.5px;}
  .moe-prog-col .ft .btn{padding:6px 9px;}
  .moe-prog-col .ft .btn svg{width:13px; height:13px;}
  .moe-note{margin-top:20px; background:#FBEBEB; border:1px solid #F0D2D2; border-radius:10px;
    padding:13px 16px; font-size:11.5px; color:#8C3A3E; line-height:1.85;}

  .hidden{display:none !important;}

  /* ---------- Responsive ---------- */
  @media (max-width: 980px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%; height:auto; position:sticky; top:0; flex-direction:row; align-items:center;
      padding:12px 16px; overflow-x:auto; z-index:20;
    }
    .sidebar-logo img{width:120px;}
    .sidebar-sub{display:none;}
    .nav-list{flex-direction:row; flex:none;}
    .nav-item{flex-direction:column; gap:4px; font-size:10.5px; padding:8px 12px; white-space:nowrap; border-inline-end:none; border-bottom:3px solid transparent;}
    .nav-item.active{border-bottom:3px solid var(--cyan); border-inline-end:none;}
    .sidebar-footer{display:none;}
    .content{padding:22px 16px;}
    .dash-grid{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:1fr 1fr;}
    .week-grid{grid-template-columns:1fr; gap:10px;}
    .panel{grid-template-columns:1fr;}
    .cal-grid{gap:4px;}
    .cal-cell{min-height:78px; padding:5px; border-radius:8px;}
    .cal-label{font-size:9px; padding:2px 4px;}
    .cal-daylabel{font-size:9.5px;}
    .cal-date{font-size:11px;}
  }

  .install-banner{
    display:flex; align-items:center; gap:10px; background:var(--navy); color:var(--white);
    padding:10px 18px; font-size:13px; line-height:1.6;
  }
  .install-banner span{flex:1;}
  .install-banner button{
    background:rgba(255,255,255,.15); border:none; color:var(--white); border-radius:6px;
    width:26px; height:26px; font-size:14px; flex:none;
  }

</style>
</head>

/* ============================================================ */
/* التخزين (يعمل داخل Claude وأيضاً كملف مستقل على الجهاز) */
/* نستخدم IndexedDB كمخزن أساسي لأن مساحته أكبر بكثير من localStorage */
/* (الذي يمتلئ بسرعة مع تراكم صور وشواهد النشاط) — مع الإبقاء على   */
/* localStorage كخطة بديلة والقراءة منه للتوافق مع البيانات القديمة */
/* ============================================================ */
const IDB_NAME = "andalus-activity-platform-db";
const IDB_STORE = "kv";
let _idbPromise = null;
function openIDB(){
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("no-indexeddb")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _idbPromise;
}
function idbGet(key){
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result == null ? null : req.result);
    req.onerror = () => reject(req.error);
  }));
}
function idbSet(key, value){
  return openIDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}
async function storageGet(key){
  if (window.storage && typeof window.storage.get === "function") {
    try { const r = await window.storage.get(key); return r ? r.value : null; } catch(e){ return null; }
  }
  /* علامة صغيرة تقول أين هبط آخر حفظ ناجح فعليًا — تحسّم أي التباس بين IndexedDB وlocalStorage
     في حال فشل الحفظ في IndexedDB لمرة عابرة وسقط تلقائيًا إلى localStorage: بدونها كنا سنقرأ
     دائمًا من IndexedDB أولاً حتى لو كانت نسخته أقدم من التي وصلت فعلاً إلى localStorage، فتبدو
     الشواهد الأحدث وكأنها اختفت رغم أنها محفوظة فعلاً. */
  let backend = null;
  try { backend = localStorage.getItem(key + "__backend"); } catch(e){}
  if (backend === "ls") {
    try { const v = localStorage.getItem(key); if (v != null) return v; } catch(e){}
  }
  try {
    const idbVal = await idbGet(key);
    if (idbVal != null) return idbVal;
  } catch(e){}
  /* لا شيء في IndexedDB بعد — إمّا أول تشغيل، أو جهاز حفظ بياناته سابقًا في localStorage قبل هذا التحديث */
  try { return localStorage.getItem(key); } catch(e){ return null; }
}
async function storageSet(key, value){
  if (window.storage && typeof window.storage.set === "function") {
    try { await window.storage.set(key, value); return true; } catch(e){}
  }
  try {
    await idbSet(key, value);
    /* بعد أول نجاح للحفظ في IndexedDB، نحذف النسخة القديمة من localStorage لتحرير مساحتها الصغيرة،
       ونثبّت العلامة على "idb" ليعرف storageGet أين المصدر الصحيح */
    try { localStorage.setItem(key + "__backend", "idb"); localStorage.removeItem(key); } catch(e){}
    return true;
  } catch(e){
    try {
      localStorage.setItem(key, value);
      try { localStorage.setItem(key + "__backend", "ls"); } catch(e2){}
      return true;
    } catch(e3){ return false; }
  }
}

/* المزامنة السحابية بين الأجهزة (Firebase — اختيارية) */
/* تُفعَّل تلقائياً فقط إذا عبّأت بياناتك في assets/firebase-config.js */
/* الشواهد (صور/فيديو) لا تُزامَن — تبقى محفوظة محلياً في كل جهاز فقط */
/* ============================================================ */
const SYNC_COLLECTION = "andalus-activity-platform";
const SYNC_DOC_ID = "shared-data";
let SYNC_ENABLED = false;
let SYNC_APPLYING_REMOTE = false;
let SYNC_STATUS = "offline"; // offline | connecting | synced | error

function stripEvidenceForSync(data){
  const copy = JSON.parse(JSON.stringify(data));
  (copy.tasks||[]).forEach(t => { delete t.evidence; });
  (copy.competitions||[]).forEach(c => { delete c.evidence; });
  if (copy.eventLog) {
    Object.keys(copy.eventLog).forEach(k => { if (copy.eventLog[k]) delete copy.eventLog[k].evidence; });
  }
  if (copy.activityPlan && copy.activityPlan.categories) {
    copy.activityPlan.categories.forEach(cat => (cat.programs||[]).forEach(p => { delete p.evidence; }));
  }
  return copy;
}

/* يُستدعى بعد أي استبدال كامل لـ DATA (تحميل محلي أو مزامنة سحابية)
   ليضمن وجود الحقول التي أُضيفت لاحقًا للمنصة حتى مع بيانات محفوظة قديمة */
function ensureDataShape(){
  if (!DATA.activityPlan || !DATA.activityPlan.categories) {
    DATA.activityPlan = JSON.parse(JSON.stringify(DEFAULT_DATA.activityPlan));
  }
  if (!DATA.programs) DATA.programs = JSON.parse(JSON.stringify(MOE_PROGRAMS));
  if (!DATA.eventLog) DATA.eventLog = {};
  if (!DATA.evidence) DATA.evidence = {};
  /* الفعاليات المضافة سابقًا (قبل إضافة خيار "مرة واحدة") كانت جميعها متكررة أسبوعيًا بلا استثناء —
     نُبقيها متكررة صراحة حتى لا تختفي فجأة، بينما أي فعالية جديدة تُضاف من الآن تكون لمرة واحدة
     افتراضيًا ما لم يُفعَّل خيار التكرار صراحة */
  (DATA.weekly||[]).forEach(w => { if (w.recurring === undefined) w.recurring = true; });
}

/* دمج إضافي آمن لمصفوفة عناصر مُعرَّفة بـ id: أي عنصر محلي غير موجود في remote (لم يصل للسحابة بعد
   من هذا الجهاز أو جهاز آخر) يبقى كما هو ولا يُحذف أبدًا بسبب المزامنة. عنصر موجود في remote يُحدَّث
   بحقوله فوق النسخة المحلية مع الإبقاء على حقل الشواهد المحلي (الشواهد لا تُزامن أصلاً). عنصر جديد
   بالكامل من remote (أضافه جهاز آخر) يُضاف محليًا. */
function mergeArrayById(localArr, remoteArr){
  const map = new Map((localArr||[]).map(x => [x.id, x]));
  (remoteArr||[]).forEach(r => {
    const local = map.get(r.id);
    if (local) {
      const merged = {...local, ...r};
      if (local.evidence && local.evidence.length) merged.evidence = local.evidence;
      map.set(r.id, merged);
    } else {
      map.set(r.id, r);
    }
  });
  return Array.from(map.values());
}
/* نفس فكرة mergeArrayById لكن لكائن eventLog (مفاتيحه "معرّف@تاريخ" وليس مصفوفة) */
function mergeEventLog(localLog, remoteLog){
  const merged = {...(localLog||{})};
  Object.keys(remoteLog||{}).forEach(k => {
    const localEntry = merged[k];
    const remoteEntry = remoteLog[k];
    if (localEntry) {
      const combined = {...localEntry, ...remoteEntry};
      if (localEntry.evidence && localEntry.evidence.length) combined.evidence = localEntry.evidence;
      merged[k] = combined;
    } else {
      merged[k] = remoteEntry;
    }
  });
  return merged;
}
/* دمج خاص بخطة رائد النشاط: الفئات نفسها ثابتة (18 فئة معرَّفة بـ key)، وما يُضاف فعليًا هو برامجها */
function mergePlanCategories(localCats, remoteCats){
  const byKey = new Map((localCats||[]).map(c => [c.key, c]));
  (remoteCats||[]).forEach(rc => {
    const lc = byKey.get(rc.key);
    if (lc) {
      lc.programs = mergeArrayById(lc.programs, rc.programs);
      Object.assign(lc, {...rc, programs: lc.programs});
    } else {
      byKey.set(rc.key, rc);
    }
  });
  return Array.from(byKey.values());
}
/* دمج البيانات الواردة من جهاز آخر — إضافي دائمًا وليس استبدالًا كاملًا، حتى لا يتسبب وصول لقطة
   قديمة أو غير مكتملة من السحابة (بسبب تأخر شبكة، أو جهاز ثانٍ لم يستلم آخر تحديث بعد) في اختفاء
   أي عنصر أُضيف محليًا (مهمة، مسابقة، برنامج خطة، شاهد) — وهذا بالضبط ما كان يحدث سابقًا عندما كانت
   DATA = remote تستبدل البيانات المحلية بالكامل. */
function mergeRemoteData(remote){
  DATA.tasks = mergeArrayById(DATA.tasks, remote.tasks);
  DATA.competitions = mergeArrayById(DATA.competitions, remote.competitions);
  DATA.weekly = mergeArrayById(DATA.weekly, remote.weekly);
  DATA.weeklyPlan = mergeArrayById(DATA.weeklyPlan, remote.weeklyPlan);
  DATA.eventLog = mergeEventLog(DATA.eventLog, remote.eventLog);
  if (remote.activityPlan && remote.activityPlan.categories) {
    if (!DATA.activityPlan) DATA.activityPlan = {categories: []};
    DATA.activityPlan.categories = mergePlanCategories(DATA.activityPlan.categories, remote.activityPlan.categories);
  }
  if (remote.vision) DATA.vision = {...DATA.vision, ...remote.vision};
  ensureDataShape();
}

function initSync(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !cfg.projectId) return;
  if (typeof firebase === "undefined") return;
  try {
    firebase.initializeApp(cfg);
    const db = firebase.firestore();
    SYNC_ENABLED = true;
    SYNC_STATUS = "connecting";
    const ref = db.collection(SYNC_COLLECTION).doc(SYNC_DOC_ID);
    window.__syncPush = (data) => {
      ref.set({ payload: JSON.stringify(stripEvidenceForSync(data)), updatedAt: Date.now() })
        .then(()=>{ SYNC_STATUS = "synced"; render(); })
        .catch(err => { SYNC_STATUS = "error"; render(); console.warn("تعذّرت مزامنة البيانات:", err); });
    };
    ref.onSnapshot(snap => {
      SYNC_STATUS = "synced";
      if (snap.exists) {
        const remote = snap.data();
        if (remote && remote.payload) {
          try {
            SYNC_APPLYING_REMOTE = true;
            mergeRemoteData(JSON.parse(remote.payload));
            SYNC_APPLYING_REMOTE = false;
          } catch(e) { SYNC_APPLYING_REMOTE = false; }
        }
      } else {
        window.__syncPush(DATA); // أول جهاز يتصل يبذر المستند المشترك ببياناته الحالية
      }
      render();
    }, err => { SYNC_STATUS = "error"; render(); console.warn("خطأ في الاتصال بالمزامنة السحابية:", err); });
  } catch(e) { SYNC_ENABLED = false; console.warn("تعذّر تفعيل المزامنة السحابية:", e); }
}

function pushToCloud(){
  if (!SYNC_ENABLED || SYNC_APPLYING_REMOTE || !window.__syncPush) return;
  window.__syncPush(DATA);
}

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayInfo(){
  const d = new Date();
  return {
    dayName: DAY_INDEX[d.getDay()],
    formatted: d.toLocaleDateString("ar-SA-u-ca-gregory", {year:"numeric", month:"long", day:"numeric"}),
  };
}
function daysUntil(dueDateStr){
  if (!dueDateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dueDateStr); due.setHours(0,0,0,0);
  return Math.round((due-today)/86400000);
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function pad2(n){ return String(n).padStart(2,"0"); }
function isoDate(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function formatLongAr(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("ar-SA-u-ca-gregory", {year:"numeric", month:"long", day:"numeric", weekday:"long"});
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function compressImageDataUrl(dataUrl, maxDim=700, quality=0.5){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let {width, height} = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width*scale); height = Math.round(height*scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function persist(){ return await storageSet(STORAGE_KEY, JSON.stringify(DATA)); }
async function mutate(fn){ fn(DATA); render(); pushToCloud(); return await persist(); }

/* ============================================================ */
/* إدارة مساحة التخزين */
/* ============================================================ */
function formatBytes(bytes){
  if (bytes < 1024) return bytes + " بايت";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " كيلوبايت";
  return (bytes/1024/1024).toFixed(2) + " ميجابايت";
}
/* يجمع كل الشواهد (صور/فيديوهات) من كل مكان في البيانات — المهام، المسابقات، برامج الخطة، وسجل الفعاليات المتكررة */
function collectAllEvidence(){
  const items = [];
  DATA.tasks.forEach(t => (t.evidence||[]).forEach(e => items.push({...e, kind:"task", ownerId:t.id, ownerTitle:t.title})));
  DATA.competitions.forEach(c => (c.evidence||[]).forEach(e => items.push({...e, kind:"competition", ownerId:c.id, ownerTitle:c.name})));
  (DATA.activityPlan && DATA.activityPlan.categories || []).forEach(cat => (cat.programs||[]).forEach(p =>
    (p.evidence||[]).forEach(e => items.push({...e, kind:"planprogram", ownerId:p.id, ownerTitle:p.name}))));
  Object.keys(DATA.eventLog||{}).forEach(k => {
    const lg = DATA.eventLog[k];
    (lg.evidence||[]).forEach(e => {
      const ev = DATA.weekly.find(w => w.id === k.split("@")[0]);
      items.push({...e, kind:"eventlog", ownerId:k, ownerTitle:(ev?ev.title:"فعالية") + " · " + (k.split("@")[1]||"")});
    });
  });
  items.forEach(e => { e.sizeBytes = e.dataUrl ? Math.round(e.dataUrl.length*0.75) : 0; });
  return items.sort((a,b)=>b.sizeBytes-a.sizeBytes);
}
function viewStorageManager(){
  const items = collectAllEvidence();
  const totalBytes = items.reduce((n,e)=>n+e.sizeBytes,0);
  const rawSize = new Blob([JSON.stringify(DATA)]).size;
  return `
    <div class="storage-overlay">
      <div class="storage-panel">
        <div class="storage-head">
          <div>
            <div style="font-weight:800;color:var(--navy);font-size:16px;">إدارة مساحة التخزين</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">حجم الشواهد: ${formatBytes(totalBytes)} · إجمالي حجم بيانات المنصة على هذا الجهاز: ${formatBytes(rawSize)}</div>
          </div>
          <button class="icon-btn" data-action="closeStoragePanel">${ICONS.x}</button>
        </div>
        <div style="font-size:12px;color:var(--muted);margin:12px 0 14px;">الشواهد (الصور والفيديوهات) تُحفظ داخل متصفح هذا الجهاز فقط، ومساحته محدودة. إذا ظهرت رسالة "تعذّر حفظ الشاهد"، احذف بعض الشواهد القديمة غير الضرورية من هنا (مرتّبة من الأكبر حجمًا) لتحرير مساحة ثم أعد المحاولة.</div>
        ${items.length ? `<div class="storage-list">
          ${items.map(e => `
            <div class="storage-item">
              ${e.type==="image" ? `<img src="${e.dataUrl}" class="storage-thumb">` : `<div class="storage-thumb storage-video">🎞️</div>`}
              <div class="flex1">
                <div class="title" style="font-size:12.5px;">${esc(e.ownerTitle)}</div>
                <div class="meta">${esc(e.name||"")}${e.name?" · ":""}${formatBytes(e.sizeBytes)}</div>
              </div>
              <button class="trash-btn" data-action="removeEvidence" data-id="${e.ownerId}" data-eid="${e.id}" data-kind="${e.kind}">${ICONS.trash}</button>
            </div>`).join("")}
        </div>` : emptyState("لا توجد شواهد محفوظة بعد")}
      </div>
    </div>`;
}

/* أقرب الأحداث القادمة — يجمع المهام، مواعيد المسابقات، برامج خطة رائد النشاط، والفعاليات الأسبوعية المتكررة في قائمة واحدة مرتبة حسب القرب */
function getUpcomingEvents(){
  const events = [];
  DATA.tasks.forEach(t => {
    if (!t.done && t.dueDate) {
      const d = daysUntil(t.dueDate);
      if (d !== null && d >= 0) events.push({date:t.dueDate, diff:d, icon:"list", color:"var(--cyan)", title:t.title, sub:"مهمة"});
    }
  });
  DATA.competitions.forEach(c => {
    if (c.deadline) {
      const d = daysUntil(c.deadline);
      if (d !== null && d >= 0) events.push({date:c.deadline, diff:d, icon:"trophy", color:"var(--magenta)", title:c.name, sub:`مسابقة${c.level?` · ${c.level}`:""}`, important: HIGH_COMP_LEVELS.has(c.level)});
    }
  });
  (DATA.activityPlan && DATA.activityPlan.categories || []).forEach(cat => {
    (cat.programs||[]).forEach(p => {
      if (!p.date) return;
      const d = daysUntil(p.date);
      if (d !== null && d >= 0) events.push({date:p.date, diff:d, icon:"target", color:"var(--navy)", title:p.name, sub:`برنامج خطة رائد النشاط · ${cat.name}`});
    });
  });
  DATA.weekly.forEach(w => {
    for (let i=0;i<8;i++){
      const d2 = new Date(_now); d2.setDate(_now.getDate()+i);
      if (DAY_INDEX[d2.getDay()] === w.day) {
        const iso = isoDate(d2.getFullYear(), d2.getMonth(), d2.getDate());
        events.push({date: iso, diff:i, icon:"calendar", color:"var(--blue)", title:w.title, sub:`فعالية متكررة${w.location?` · ${w.location}`:""}`});
        break;
      }
    }
  });
  return events.sort((a,b) => a.diff - b.diff || a.date.localeCompare(b.date));
}

function viewDashboard(){
  const today = todayInfo();
  const todayStr = isoDate(_now.getFullYear(), _now.getMonth(), _now.getDate());
  const todaysWeekly = DATA.weekly.filter(w => w.recurring ? w.day === today.dayName : w.date === todayStr);
  const dailyTasks = DATA.tasks.filter(t => t.type === "يومي");
  const weeklyTasksToday = DATA.tasks.filter(t => t.type === "أسبوعي" && t.day === today.dayName);
  /* كل مهمة مؤرّخة اليوم أو أُنجزت اليوم — مهما كان نوعها */
  const datedToday = DATA.tasks.filter(t =>
    (t.dueDate === todayStr || t.doneDate === todayStr) &&
    t.type !== "يومي" && !(t.type === "أسبوعي" && t.day === today.dayName));
  const openDaily = dailyTasks.filter(t=>!t.done);
  const upcomingEvents = getUpcomingEvents();
  const dueSoonCount = upcomingEvents.filter(e => e.diff <= 3).length;
  const nearestEvent = upcomingEvents[0] || null;
  const compsOpen = DATA.competitions.filter(c => c.status === "تسجيل مفتوح");

  const scheduleItems = [
    ...todaysWeekly.map(w => `
      <div class="item">
        <div class="time">${ICONS.clock.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="14" height="14"')}<span>${esc(w.time)}</span></div>
        <div class="flex1"><div class="title">${esc(w.title)}</div>
        ${w.location ? `<div class="meta">${ICONS.pin.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="11" height="11"')} ${esc(w.location)}</div>` : ""}</div>
      </div>`),
    ...[...weeklyTasksToday, ...datedToday].map(t => `
      <div class="item">
        <button class="check ${t.done?"done":""}" data-action="toggleTask" data-id="${t.id}">${ICONS.check}</button>
        <div class="flex1">
          <div class="title" style="${t.done?'text-decoration:line-through;opacity:.6;':''}">${esc(t.title)}</div>
          <div class="meta">${esc(t.type)}${t.domain?` · ${esc(t.domain)}`:""}${(t.evidence&&t.evidence.length)?` · 📎 ${t.evidence.length}`:""}</div>
        </div>
        ${chip(t.priority, PRIORITY_COLOR[t.priority])}
      </div>`)
  ].join("");

  return `
    <div class="hero">
      <img class="hero-mark" src="${LOGO.whiteMark}" alt="">
      <div class="rel">
        <div class="when">${esc(today.dayName)} · ${esc(today.formatted)}</div>
        <h2>مساء الخير، عبدالله</h2>
        <div class="sub">لديك ${todaysWeekly.length + weeklyTasksToday.length + datedToday.length} عملًا مجدولًا اليوم، منها ${openDaily.length} مهمة يومية بانتظارك.</div>
        ${nearestEvent ? `<div class="sub" style="margin-top:8px; font-weight:800;">${ICONS.alert.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="14" height="14"')} أقرب حدث قادم: ${esc(nearestEvent.title)} — ${nearestEvent.diff===0?"اليوم":nearestEvent.diff===1?"غدًا":`بعد ${nearestEvent.diff} يوم`}${nearestEvent.important?" ⭐":""}</div>` : ""}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="num">${todaysWeekly.length + weeklyTasksToday.length + datedToday.length}</div><div class="lbl">أعمال اليوم</div></div>
      <div class="stat-card"><div class="num">${openDaily.length}</div><div class="lbl">مهام يومية متبقية</div></div>
      <div class="stat-card"><div class="num">${dueSoonCount}</div><div class="lbl">مواعيد قريبة</div></div>
      <div class="stat-card"><div class="num">${compsOpen.length}</div><div class="lbl">مسابقات تسجيلها مفتوح</div></div>
    </div>

    <div class="dash-grid">
      <div>
        ${sectionTitle("فعاليات اليوم", "جدول " + today.dayName, "calendar")}
        <div class="list">${scheduleItems || emptyState("لا توجد فعاليات ثابتة مجدولة لهذا اليوم")}</div>

        <div style="height:26px"></div>
        ${sectionTitle("مهام متكررة", "مهامي اليومية", "list")}
        <div class="list">
          ${dailyTasks.length ? dailyTasks.map(t => `
            <div class="item">
              <button class="check ${t.done?"done":""}" data-action="toggleTask" data-id="${t.id}">${ICONS.check}</button>
              <div class="flex1">
                <div class="title" style="${t.done?'text-decoration:line-through;opacity:.6;':''}">${esc(t.title)}</div>
                ${(t.domain||(t.evidence&&t.evidence.length))?`<div class="meta">${t.domain?esc(t.domain):""}${(t.evidence&&t.evidence.length)?`${t.domain?" · ":""}📎 ${t.evidence.length} شاهد`:""}</div>`:""}
              </div>
              ${chip(t.priority, PRIORITY_COLOR[t.priority])}
            </div>`).join("") : emptyState("لا توجد مهام يومية بعد")}

          ${sectionTitle("تنبيه", "أقرب الأحداث القادمة", "alert")}

            <div class="item" style="padding:8px 10px; margin-bottom:6px; ${e.important?'border:1px solid var(--magenta);':''}">

        </div>
      </div>
    </div>
  `;
}

function viewActivityPlan(){
  const cats = DATA.activityPlan.categories;
  const totalTarget = cats.reduce((n,c)=>n+(c.target||0),0);
  const totalActual = cats.reduce((n,c)=>n+(c.actual||0),0);
  const totalPrograms = cats.reduce((n,c)=>n+c.programs.length,0);

  const catCards = cats.map(cat => {
    const rows = [...cat.programs].sort((a,b)=>a.date.localeCompare(b.date)).map(p => {
      const studentCount = (p.students && p.students.length) ? p.students.length : p.actualCount;
      const evidenceCount = (p.evidence||[]).length;
      const semLabel = `فصل ${p.semester} · الأسبوع ${p.week}`;
      const panelRows = [];
      if (STUDENTS_OPEN_ID === p.id) panelRows.push(`<tr class="evidence-row"><td colspan="4">${planStudentsPanel(p)}</td></tr>`);
      if (EVIDENCE_OPEN_ID === p.id) panelRows.push(`<tr class="evidence-row"><td colspan="4">${evidencePanel(p, "planprogram")}</td></tr>`);
      return `
      <tr>
        <td style="width:150px; font-size:12px; color:var(--muted);">${esc(formatLongAr(p.date))}<div style="font-size:10.5px; margin-top:2px;">${semLabel}</div></td>
        <td>
          <div class="tt">${esc(p.name)}</div>
          <div class="meta">${esc(p.desc)}${p.location?` · ${esc(p.location)}`:""}</div>
        </td>
        <td style="width:90px; text-align:center; font-size:12px; font-weight:700; color:var(--navy);">${p.targetCount}</td>
        <td style="width:260px;">
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <button class="evidence-btn has" data-action="togglePlanStudents" data-id="${p.id}">👥 الطلاب المنفذون (${studentCount})</button>
            <button class="evidence-btn ${evidenceCount?'has':''}" data-action="toggleEvidence" data-id="${p.id}">📎 الشواهد${evidenceCount?` (${evidenceCount})`:""}</button>
            <button class="icon-btn" data-action="removePlanProgram" data-id="${p.id}" title="حذف البرنامج">${ICONS.trash}</button>
          </div>

      </tr>` + panelRows.join("");

    /* تصنيف برامج المؤشر حسب طبيعة الحدث — رحلة / مسابقة / مشروع — لإظهار عدد كل نوع أمام كل مؤشر */
    const tripCount = cat.programs.filter(p=>/رحل/.test(p.name+" "+p.desc)).length;
    const compCount = cat.programs.filter(p=>/مسابق|أولمبياد|تحدي/.test(p.name+" "+p.desc)).length;
    const projCount = cat.programs.filter(p=>/مشروع|ريادة/.test(p.name+" "+p.desc)).length;

    return `
      <div class="card" style="margin-bottom:20px;">

          <div>
            <div style="font-weight:800; color:var(--navy); font-size:15px;">${esc(cat.name)}</div>
            <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">${cat.weight?`الوزن النسبي ${cat.weight}% · `:""}المستهدف ${cat.target} · المخطط له ${cat.planned} · الفعلي ${cat.actual}</div>

      </div>`;
  }).join("");

  return `
    <div class="topbar">
      ${sectionTitle("مستهدفات ومؤشرات العام السابق — مؤقتًا لحين نزول الخطة الجديدة", "خطة رائد النشاط", "target")}

    <div class="report-card plan-print-only" id="plan-print-card">${planPrintHtml(cats, totalTarget, totalActual, totalPrograms)}</div>
  `;
}

    const tripCount = cat.programs.filter(p=>/رحل/.test(p.name+" "+p.desc)).length;
    const compCount = cat.programs.filter(p=>/مسابق|أولمبياد|تحدي/.test(p.name+" "+p.desc)).length;
    const projCount = cat.programs.filter(p=>/مشروع|ريادة/.test(p.name+" "+p.desc)).length;
    const sortedPrograms = [...cat.programs].sort((a,b)=>a.date.localeCompare(b.date));
    return `
    <div class="rpt-page">
      <div class="rpt-watermark">${String(idx+1).padStart(2,"0")}</div>
      <div class="rpt-eyebrow">فئة ${idx+1} من ${cats.length}</div>
      <div class="rpt-h1">${esc(cat.name)}</div>
      <div class="rpt-lead">${cat.weight?`الوزن النسبي ${cat.weight}% · `:""}🚌 رحلات ${tripCount} · 🏆 مسابقات ${compCount} · 💡 مشاريع ${projCount}</div>
      <div class="rpt-domain" style="background:var(--navy);">
        <div><div class="n">${cat.actual}</div><div class="l">من إجمالي مستهدف ${cat.target} مشاركة (مخطط له ${cat.planned})</div></div>
        <div class="pill">${cat.programs.length} برنامج تنفيذ</div>
      </div>
      <div class="rpt-cards two" style="margin-top:24px;">
        ${sortedPrograms.map(p=>{
          const studentCount = (p.students && p.students.length) ? p.students.length : p.actualCount;
          return `<div class="rpt-cardx">
            <div class="t">${esc(p.name)}<span class="rpt-datepill">${esc(formatLongAr(p.date))}</span></div>
            <div class="d">${esc(p.desc)}${p.location?` · ${esc(p.location)}`:""}<br>عدد الطلاب المنفذين: ${studentCount} · فصل ${p.semester} · الأسبوع ${p.week}</div>
          </div>`;
        }).join("")}
      </div>
      ${rptFoot(pg, "خطة رائد النشاط · مدارس الأندلس الأهلية")}
    </div>`;
  }).join("");

  return `<div class="rpt-doc">${cover}${catPages}</div>`;
}

  const isRecurring = editing ? !!editing.recurring : false;

function viewWeekly(){
  const formPanel = (SHOW_WEEKLY_FORM && !EDIT_WEEKLY_ID) ? weeklyFormPanel() : "";

  /* نطاق الأسبوع الحالي (الأحد إلى السبت) — الفعاليات المتكررة تظهر دائمًا حسب يومها، والفعاليات
     لمرة واحدة تظهر فقط إن وقع تاريخها ضمن هذا الأسبوع بالذات */
  const weekStart = new Date(_now); weekStart.setDate(_now.getDate() - _now.getDay());
  const weekDateByDay = {};
  for (let i=0;i<7;i++){
    const d2 = new Date(weekStart); d2.setDate(weekStart.getDate()+i);
    weekDateByDay[DAY_INDEX[d2.getDay()]] = isoDate(d2.getFullYear(), d2.getMonth(), d2.getDate());
  }

  const cols = DAYS.map(day => {
    const items = DATA.weekly.filter(w => w.recurring ? w.day === day : w.date === weekDateByDay[day]).sort((a,b)=>a.time.localeCompare(b.time));
    return `
      <div class="day-col">
        <div class="day-col-head"><span>${day}</span><span class="count">${items.length}</span></div>
        ${items.length ? items.map(w => `
          <div class="event-card">
            ${EDIT_WEEKLY_ID === w.id ? inlineWeeklyEditForm(w) : `
            <div class="row">
              <div>
                <div class="t">${esc(w.time)}</div>
                <div class="n">${esc(w.title)}</div>
                ${w.location ? `<div class="loc">${ICONS.pin.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="10" height="10"')} ${esc(w.location)}</div>` : ""}
              </div>
              <div class="event-actions">
                <button class="icon-btn" data-action="editWeekly" data-id="${w.id}">${ICONS.pencil}</button>
                <button class="trash-btn" data-action="removeWeekly" data-id="${w.id}">${ICONS.trash}</button>
              </div>
            </div>`}
          </div>`).join("") : `<div class="day-empty">لا توجد فعاليات</div>`}
      </div>`;
  }).join("");

  return `
    <div class="topbar">
      ${sectionTitle("متكرر أسبوعياً", "الجدول الأسبوعي", "calendar")}
      <button class="btn accent" data-action="toggleWeeklyForm">${SHOW_WEEKLY_FORM ? ICONS.x : ICONS.plus}<span>إضافة فعالية</span></button>
    </div>
    ${formPanel}
    <div class="week-grid">${cols}</div>
  `;
}

function evidenceThumb(e, kind){
  if (e.type === "video") {
    return `<div class="evidence-thumb">
      <video src="${e.dataUrl}" controls></video>
      <button class="evidence-remove" data-action="removeEvidence" data-kind="${kind}" data-id="${e._parentId}" data-eid="${e.id}">${ICONS.x}</button>
    </div>`;
  }
  return `<div class="evidence-thumb">
    <img src="${e.dataUrl}" alt="">
    <button class="evidence-remove" data-action="removeEvidence" data-kind="${kind}" data-id="${e._parentId}" data-eid="${e.id}">${ICONS.x}</button>
  </div>`;
}

function evidencePanel(t, kind="task"){
  const items = (t.evidence || []).map(e => ({...e, _parentId: t.id}));
  return `
    <div class="evidence-panel">
      <label class="upload-btn">📎 إضافة صورة أو فيديو كشاهد

      </label>
      ${items.length ? `<div class="evidence-grid">${items.map(e=>evidenceThumb(e, kind)).join("")}</div>` : `<div style="color:var(--muted); font-size:12.5px; margin-top:8px;">لا توجد شواهد مرفوعة بعد</div>`}
    </div>`;
}

function viewTasks(){
  const filters = ["الكل","متبقية","منجزة", ...TASK_TYPES];
  const filtered = DATA.tasks.filter(t => {
    if (TASK_FILTER === "الكل") return true;
    if (TASK_FILTER === "منجزة") return t.done;
    if (TASK_FILTER === "متبقية") return !t.done;
    return t.type === TASK_FILTER;
  });

  const formPanel = SHOW_TASK_FORM ? `
    <div class="panel">
      <div class="field full"><label>عنوان المهمة</label><input id="t-title" type="text" placeholder="مثال: تحديث لوحة الإعلانات"></div>

        <button class="btn ghost" data-action="closeTaskForm">إلغاء</button>
        <button class="btn" data-action="addTask">إضافة المهمة</button>

  const rows = filtered.map(t => {
    const evCount = (t.evidence || []).length;
    const row = `
    <tr class="${t.done ? "done-row":""}">
      <td style="width:36px"><button class="check ${t.done?"done":""}" data-action="toggleTask" data-id="${t.id}">${ICONS.check}</button></td>

      <td style="width:110px">${chip(t.priority, PRIORITY_COLOR[t.priority])}</td>

  return `

      ${sectionTitle("كل ما يلزم فعله", "المهام", "list")}

function viewAlerts(){
  const today = todayInfo();
  const overdue = DATA.tasks.filter(t => !t.done && t.dueDate && daysUntil(t.dueDate) < 0)
    .sort((a,b)=>daysUntil(a.dueDate)-daysUntil(b.dueDate));
  const next7 = DATA.tasks.filter(t => !t.done && t.dueDate && daysUntil(t.dueDate) >= 0 && daysUntil(t.dueDate) <= 7)
    .sort((a,b)=>daysUntil(a.dueDate)-daysUntil(b.dueDate));
  const weeklyReminders = DATA.tasks.filter(t => !t.done && t.type === "أسبوعي");
  const compDeadlines = DATA.competitions.filter(c => c.deadline && daysUntil(c.deadline) >= 0 && daysUntil(c.deadline) <= 14)
    .sort((a,b)=>daysUntil(a.deadline)-daysUntil(b.deadline));
  const planDeadlines = (DATA.activityPlan && DATA.activityPlan.categories || [])
    .flatMap(cat => (cat.programs||[]).map(p => ({...p, catName: cat.name})))
    .filter(p => p.date && daysUntil(p.date) >= 0 && daysUntil(p.date) <= 14)
    .sort((a,b)=>daysUntil(a.date)-daysUntil(b.date));
  /* المسابقات ذات الأهمية الخاصة: مراكز تنافسية أو مستوى دولي/عالمي — تُراجع دائمًا بغض النظر عن قرب الموعد */
  const importantComps = DATA.competitions.filter(c => HIGH_COMP_LEVELS.has(c.level));
  const nearestEvent = getUpcomingEvents()[0] || null;

  const todayIdx = DAYS.indexOf(today.dayName);
  const weeklyOrdered = todayIdx === -1 ? [] :
    [...DAYS.slice(todayIdx), ...DAYS.slice(0,todayIdx)].map(day => ({day, items: DATA.weekly.filter(w=>w.day===day)}));

  return `
    ${sectionTitle("لا تفوّت شيئاً", "التنبيهات", "bell")}
    ${nearestEvent ? `
      <div class="alert-row soon" style="margin-bottom:18px;">
        ${ICONS.alert}
        <span class="t"><b>أقرب حدث قادم:</b> ${esc(nearestEvent.title)} <span style="color:var(--muted); font-weight:600;">(${esc(nearestEvent.sub)})</span>${nearestEvent.important?" ⭐":""}</span>
        <b>${nearestEvent.diff===0?"اليوم":nearestEvent.diff===1?"غدًا":`بعد ${nearestEvent.diff} يوم`}</b>
      </div>` : ""}
    <div class="dash-grid">
      <div>
        ${overdue.length ? `
          <div style="font-weight:800;color:var(--coral);margin-bottom:10px;font-size:14px;">متأخرة</div>
          <div class="list" style="margin-bottom:24px;">
            ${overdue.map(t=>`
              <div class="alert-row late">${ICONS.alert}<span class="t">${esc(t.title)}</span><b>منذ ${Math.abs(daysUntil(t.dueDate))} يوم</b></div>`).join("")}
          </div>` : ""}

        <div style="font-weight:800;color:var(--navy);margin-bottom:10px;font-size:14px;">خلال 7 أيام</div>
        <div class="list" style="margin-bottom:24px;">
          ${next7.length ? next7.map(t=>`
            <div class="item"><span style="color:var(--cyan)">${ICONS.clock.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="15" height="15"')}</span>
              <div class="flex1 title">${esc(t.title)}</div>
              <b style="color:var(--cyan); font-size:12px;">${daysUntil(t.dueDate)===0?"اليوم":`بعد ${daysUntil(t.dueDate)} يوم`}</b>
            </div>`).join("") : emptyState("لا مواعيد نهائية قريبة")}
        </div>

        ${weeklyReminders.length ? `
          <div style="font-weight:800;color:var(--navy);margin-bottom:10px;font-size:14px;">مهام أسبوعية متكررة</div>
          <div class="list">
            ${weeklyReminders.map(t=>`
              <div class="item">${ICONS.bell.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="15" height="15" style="color:var(--navy)"')}
                <div class="flex1 title">${esc(t.title)}</div>
                <b style="color:var(--blue); font-size:12px;">${esc(t.day)}</b>
              </div>`).join("")}
          </div>` : ""}

        ${compDeadlines.length ? `
          <div style="font-weight:800;color:var(--magenta);margin-bottom:10px;font-size:14px;">مواعيد مسابقات قريبة</div>
          <div class="list" style="margin-bottom:24px;">
            ${compDeadlines.map(c=>`
              <div class="item" style="${HIGH_COMP_LEVELS.has(c.level)?'border:1px solid var(--magenta);':''}">${ICONS.trophy.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="15" height="15" style="color:var(--magenta)"')}
                <div class="flex1 title">${esc(c.name)}${HIGH_COMP_LEVELS.has(c.level)?" ⭐":""} <span style="font-weight:600; color:var(--muted); font-size:11.5px;">${esc(c.level)}</span></div>
                <b style="color:var(--magenta); font-size:12px;">${daysUntil(c.deadline)===0?"اليوم":`بعد ${daysUntil(c.deadline)} يوم`}</b>
              </div>`).join("")}

        ${planDeadlines.length ? `

          <div class="list">
            ${importantComps.map(c=>`
              <div class="item">${ICONS.trophy.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="15" height="15" style="color:var(--magenta)"')}
                <div class="flex1"><div class="title">${esc(c.name)} ⭐</div><div class="meta">${esc(c.level)}${c.deadline?` · الموعد: ${formatLongAr(c.deadline)}`:" · بلا موعد محدد بعد"}</div></div>
                ${chip(c.status, COMP_STATUS_COLOR[c.status])}

      </div>

      <div class="side-panel">
        <div>
          <div style="font-weight:800;color:var(--navy);margin-bottom:10px;font-size:14px;">الجدول الأسبوعي القادم</div>
          ${weeklyOrdered.map(({day,items}) => `

              <div style="font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;">${day}${day===today.dayName?" · اليوم":""}</div>
              ${items.length ? items.sort((a,b)=>a.time.localeCompare(b.time)).map(w=>`
                <div class="item" style="padding:8px 10px; margin-bottom:6px;">
                  <span style="font-size:11px;font-weight:800;color:var(--cyan);width:38px;flex-shrink:0;">${esc(w.time)}</span>
                  <span class="flex1" style="font-size:12.5px;font-weight:700;">${esc(w.title)}</span>
                </div>`).join("") : `<div class="day-empty">لا فعاليات</div>`}

/* التقويم السنوي */

const FULL_DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTH_NAME_FMT = new Intl.DateTimeFormat("ar-SA-u-ca-gregory", {month:"long", year:"numeric"});

function getDayItems(iso, weekdayName){
  /* الفعاليات المتكررة لا تظهر إلا بدءًا من بداية العام الدراسي — قبل ذلك لا توجد دراسة أصلًا.
     الفعاليات لمرة واحدة تظهر فقط في تاريخها المحدد بالضبط. */
  const weeklyEvents = DATA.weekly.filter(w =>
    w.recurring ? (w.day === weekdayName && iso >= SY_START) : (w.date === iso)
  ).sort((a,b)=>a.time.localeCompare(b.time));
  const tasksDue = DATA.tasks.filter(t => t.dueDate === iso);
  const programsDue = (DATA.activityPlan && DATA.activityPlan.categories || []).flatMap(cat =>
    (cat.programs||[]).filter(p => p.date === iso).map(p => ({...p, catName: cat.name})));
  const planEntry = DATA.weeklyPlan.find(p => p.startDate && p.endDate && iso >= p.startDate && iso <= p.endDate);
  return {weeklyEvents, tasksDue, programsDue, planEntry};
}

function buildTableRows(){
  const daysInMonth = new Date(CAL_YEAR, CAL_MONTH+1, 0).getDate();
  const todayIso = isoDate(_now.getFullYear(), _now.getMonth(), _now.getDate());
  let rows = "";
  for (let d=1; d<=daysInMonth; d++){
    const iso = isoDate(CAL_YEAR, CAL_MONTH, d);
    const weekdayName = DAY_INDEX[new Date(CAL_YEAR, CAL_MONTH, d).getDay()];
    const {weeklyEvents, tasksDue, programsDue, planEntry} = getDayItems(iso, weekdayName);
    const items = [];
    weeklyEvents.forEach(w => items.push(`<div style="display:flex; align-items:center; gap:6px;">🕐 <b>${esc(w.time)}</b> — ${esc(w.title)}${w.location?` <span style="color:var(--muted)">(${esc(w.location)})</span>`:""}<button class="icon-btn" data-action="editWeekly" data-id="${w.id}" style="margin-inline-start:auto;">${ICONS.pencil}</button><button class="trash-btn" data-action="removeWeekly" data-id="${w.id}">${ICONS.trash}</button></div>`));
    tasksDue.forEach(t => items.push(`<div style="color:${t.done?'var(--muted)':'var(--coral)'}">${t.done?"✔":"◻"} ${esc(t.title)}</div>`));
    programsDue.forEach(p => items.push(`<div style="color:var(--navy)">🎯 ${esc(p.name)} <span style="color:var(--muted)">(${esc(p.catName)})</span></div>`));
    if (planEntry) items.push(`<div style="color:var(--magenta)">📌 ${esc(planEntry.focus)}</div>`);
    const rowClasses = ["cal-row"];
    if (iso === todayIso) rowClasses.push("cal-row-today");
    else if (planEntry) rowClasses.push("cal-row-plan");
    rows += `
      <tr class="${rowClasses.join(" ")}">
        <td style="width:70px; text-align:center; font-weight:800; color:${syWeekNo(iso)?'var(--navy)':'#B8C0CE'};">${syWeekNo(iso)||"—"}</td>
        <td class="cal-table-day">${weekdayName}</td>
        <td class="cal-table-date">${esc(formatLongAr(iso))}</td>
        <td class="cal-table-items">${items.length ? items.join("") : `<span style="color:var(--muted)">—</span>`}</td>
      </tr>`;
  }
  return rows;
}

function viewCalendar(){
  const first = new Date(CAL_YEAR, CAL_MONTH, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(CAL_YEAR, CAL_MONTH+1, 0).getDate();
  const todayIso = isoDate(_now.getFullYear(), _now.getMonth(), _now.getDate());

  let cells = "";
  for (let i=0; i<startWeekday; i++) cells += `<div class="cal-cell blank"></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const iso = isoDate(CAL_YEAR, CAL_MONTH, d);
    const weekdayName = DAY_INDEX[new Date(CAL_YEAR, CAL_MONTH, d).getDay()];
    const {weeklyEvents, tasksDue, programsDue, planEntry} = getDayItems(iso, weekdayName);

    const labels = [];
    weeklyEvents.forEach(w => labels.push(`<div class="cal-label" style="background:#EAF1FC; color:var(--navy);">${esc(w.title)}</div>`));
    tasksDue.forEach(t => {
      const col = (!t.done && t.priority==="عالية") ? "var(--coral)" : "var(--cyan)";
      const bg = (!t.done && t.priority==="عالية") ? "#FCEBEA" : "#E7F6FA";
      labels.push(`<div class="cal-label" style="background:${bg}; color:${col};">${esc(t.title)}</div>`);
    });
    programsDue.forEach(p => labels.push(`<div class="cal-label" style="background:#EAF1FC; color:var(--navy);">🎯 ${esc(p.name)}</div>`));
    if (planEntry) labels.push(`<div class="cal-label" style="background:#F6EAF5; color:var(--magenta);">📌 ${esc(planEntry.focus)}</div>`);

    const maxShown = 3;
    const shown = labels.slice(0, maxShown).join("");
    const moreCount = labels.length - maxShown;
    const more = moreCount > 0 ? `<div class="cal-more">+${moreCount} أخرى</div>` : "";

    const classes = ["cal-cell"];
    if (iso === todayIso) classes.push("today");
    if (iso === CAL_SELECTED) classes.push("selected");
    if (planEntry) classes.push("in-plan");
    cells += `<div class="${classes.join(" ")}" data-action="calSelectDay" data-date="${iso}">
        <div class="cal-date">${d}</div>
        <div class="cal-labels">${shown}${more}</div>
      </div>`;
  }
  const totalCells = startWeekday + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i=0; i<trailing; i++) cells += `<div class="cal-cell blank"></div>`;

  const selWeekday = DAY_INDEX[new Date(CAL_SELECTED + "T00:00:00").getDay()];
  const sel = getDayItems(CAL_SELECTED, selWeekday);

  const detailBody = `
    ${sel.planEntry ? `
      <div class="alert-row soon" style="background:#F6EAF5; color:var(--magenta); margin-bottom:14px;">
        ${ICONS.compass}<span class="t" style="color:var(--ink);">خطة الأسبوع (${esc(sel.planEntry.startDate)} — ${esc(sel.planEntry.endDate)}): ${esc(sel.planEntry.focus)}</span>
      </div>` : ""}
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <div style="font-weight:800;color:var(--navy);font-size:13px;">الفعاليات المتكررة</div>
    </div>
    ${sel.weeklyEvents.length ? `
      <div class="list" style="margin-bottom:16px;">
        ${sel.weeklyEvents.map(w=> {
          if (EDIT_WEEKLY_ID === w.id) return `<div class="item" style="display:block;">${inlineWeeklyEditForm(w)}</div>`;
